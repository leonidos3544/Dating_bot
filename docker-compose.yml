version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dating_db
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: secret
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d dating_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY main.py .
        CMD ["python", "main.py"]
    environment:
      BOT_TOKEN: "8727523358:AAE8AZEe6EbY1hud23WE6vX2TEN8Kk9Ntfg"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dating_db
      DB_USER: bot_user
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
